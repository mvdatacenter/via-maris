name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  IMAGE: ghcr.io/mvdatacenter/via-maris

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # cosign's keyless signing exchanges this job's OIDC token for its certificate.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.27.3@sha256:f20d83a83e18dbd2a4714b8ffd4b30b287b6243962dd75608e86abcc63ba4efc go test ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # A job of its own, so that re-running a failed check checks the same digest
  # instead of building, pushing and signing a new one. It holds no token and
  # logs in nowhere, so a package that stops being public fails here.
  verify:
    needs: image
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the tag as a reader does
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          verified=$(cosign verify "$IMAGE:$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/mvdatacenter/via-maris/\.github/workflows/release\.yml@refs/tags/v' |
            jq -r '.[].critical.image."docker-manifest-digest"' | sort -u)
          if [ "$verified" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG verified without a login as ${verified:-nothing}, not the pushed $DIGEST"
            exit 1
          fi
