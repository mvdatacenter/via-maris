name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # cosign's keyless signing exchanges this job's OIDC token for its certificate.
      id-token: write
    env:
      IMAGE: ghcr.io/mvdatacenter/via-maris
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.27.3@sha256:f20d83a83e18dbd2a4714b8ffd4b30b287b6243962dd75608e86abcc63ba4efc go test ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The re-check's image, the same program with OSV-Scanner beside it, is
      # tagged in the same package so it shares the package's visibility.
      - id: build-recheck
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: recheck
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-recheck
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          DIGESTS: ${{ steps.build.outputs.digest }} ${{ steps.build-recheck.outputs.digest }}
        run: |
          for digest in $DIGESTS; do
            cosign sign --yes "$IMAGE@$digest"
            echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          done

      # The image is pulled without credentials, so a private package would
      # publish here and still fail every pull.
      - name: Check the image pulls anonymously
        env:
          DIGESTS: ${{ steps.build.outputs.digest }} ${{ steps.build-recheck.outputs.digest }}
        run: |
          for digest in $DIGESTS; do
            if ! token=$(curl -fsS "https://ghcr.io/token?scope=repository:mvdatacenter/via-maris:pull" | jq -r .token) ||
               ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
                 "https://ghcr.io/v2/mvdatacenter/via-maris/manifests/$digest"; then
              echo "::error::$IMAGE@$digest is not publicly pullable; set the package's visibility to public"
              exit 1
            fi
          done
